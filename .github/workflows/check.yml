name: Check question bank

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate data and rebuild pages
        run: python scripts/build.py
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Built pages are committed
        run: |
          if ! git diff --quiet -- docs; then
            echo "::error::docs/ is out of date. Run 'python scripts/build.py' and commit the result."
            git diff --stat -- docs
            exit 1
          fi
