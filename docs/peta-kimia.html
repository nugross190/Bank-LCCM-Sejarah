*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6}
.wrap{max-width:1120px;margin:0 auto;padding-inline:20px;padding-block:28px 64px}
h1,h2,h3{font-family:var(--f-label);text-wrap:balance;line-height:1.15;margin:0}
h1{font-size:clamp(2rem,5vw,3.1rem);font-weight:700;letter-spacing:-.01em}
h2{font-size:1.65rem;font-weight:700}
h3{font-size:1.15rem;font-weight:600}
p{margin:0}
a{color:inherit}
mark{background:var(--mark);color:inherit;border-radius:2px;padding:0 1px}
sub,sup{line-height:0}
.eyebrow{font-family:var(--f-label);font-weight:600;font-size:.8rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.mono{font-family:var(--f-mono);font-size:.82em}
.lead{max-width:66ch;color:var(--muted);font-size:1.05rem;margin-top:12px}
section{margin-top:44px}
.sec-head{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px 16px;margin-bottom:16px;border-bottom:2px solid var(--ink);padding-bottom:8px}
.sec-head p{color:var(--muted);font-size:.95rem;max-width:62ch}

.progress{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,140px),1fr));gap:8px;margin-top:22px}
.pg{display:flex;flex-direction:column;gap:5px;text-decoration:none;min-width:0}
.pg b{font-family:var(--f-label);font-size:.92rem;color:var(--c)}
.pg .bar{height:10px;background:var(--sunk);border-radius:2px;overflow:hidden;position:relative}
.pg .bar i{position:absolute;inset:0 auto 0 0;background:var(--c);width:0;transition:width .3s}
.pg .bar::after{content:"";position:absolute;inset:0;border:1.5px solid var(--c);border-radius:2px}
.pg span{font-size:.78rem;color:var(--muted);font-family:var(--f-label)}
.pg:focus-visible{outline:2px solid var(--c);outline-offset:3px}

.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:22px}
.search{flex:1 1 260px;min-width:0;display:flex;align-items:center;gap:8px;background:var(--surface);border:1.5px solid var(--line);border-radius:6px;padding:0 12px}
.search:focus-within{border-color:var(--ink)}
.search input{flex:1;min-width:0;border:0;background:transparent;color:var(--ink);font:inherit;padding:10px 0;outline:none}
.btn{font-family:var(--f-label);font-weight:600;font-size:.92rem;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);padding:9px 14px;border-radius:6px;cursor:pointer}
.btn:hover{border-color:var(--ink)}
.btn:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
#hits{font-size:.9rem;color:var(--muted);font-family:var(--f-label)}
.overall{font-family:var(--f-label);font-size:.95rem;color:var(--muted);margin-top:10px}
.overall b{color:var(--ink);font-variant-numeric:tabular-nums}

.path-wrap{overflow-x:auto;padding-bottom:6px}
.path{list-style:none;margin:0;padding:0;display:grid;grid-auto-flow:column;grid-auto-columns:minmax(130px,1fr);min-width:max-content}
.path li{border-top:2px solid var(--ink);padding:0 10px 0 0;position:relative}
.path li::before{content:"";position:absolute;left:0;top:-7px;width:12px;height:12px;border-radius:50%;background:var(--ink)}
.path button{all:unset;cursor:pointer;display:flex;flex-direction:column;gap:4px;padding-top:14px;max-width:16em}
.path button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.path .lb{font-family:var(--f-mono);font-size:.74rem;color:var(--muted)}
.path .nm{font-family:var(--f-label);font-weight:700;font-size:1rem;line-height:1.15}
.path .an{font-size:.8rem;color:var(--muted);line-height:1.35}

.map{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:14px}
.mcol{border-top:4px solid var(--c);background:var(--surface);border-radius:0 0 8px 8px;padding:14px;min-width:0}
.mcol h3{color:var(--c);display:flex;justify-content:space-between;gap:8px}
.mcol ul{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
.chip{display:flex;gap:10px;align-items:baseline;text-decoration:none;padding:6px 8px;border-radius:5px;background:var(--soft);font-size:.93rem;line-height:1.35}
.chip:hover{outline:1.5px solid var(--c)}
.chip:focus-visible{outline:2px solid var(--c)}
.chip .mono{color:var(--c);flex:none}
.chip.done{text-decoration:line-through;text-decoration-color:var(--muted);opacity:.72}
.tier{display:inline-block;font-family:var(--f-label);font-size:.72rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:3px;white-space:nowrap}
.t1{background:var(--ink);color:var(--bg)}
.t2{border:1.3px solid var(--ink)}
.t3{border:1.3px dashed var(--muted);color:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:12px;font-size:.88rem;color:var(--muted);align-items:center}

.domain-head{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:baseline;border-bottom:2px solid var(--c);padding-bottom:8px;margin-bottom:14px}
.domain-head h2{color:var(--c)}
.domain-head .w{font-family:var(--f-mono);font-size:1rem;color:var(--c)}
.domain-head p{color:var(--muted);font-size:.92rem;flex-basis:100%}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;min-width:0;scroll-margin-top:16px}
.card + .card{margin-top:10px}
.card-head{display:flex;gap:12px;align-items:flex-start;padding:14px 16px}
.toggle{all:unset;cursor:pointer;flex:1;min-width:0;display:grid;grid-template-columns:auto 1fr;gap:2px 14px}
.toggle:focus-visible{outline:2px solid var(--c);outline-offset:4px;border-radius:4px}
.toggle .code{font-family:var(--f-mono);font-size:.8rem;color:var(--c);padding-top:4px;grid-row:span 3}
.toggle .ttl{font-family:var(--f-label);font-size:1.22rem;font-weight:700;line-height:1.2;display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.toggle .meta{font-size:.82rem;color:var(--muted);font-family:var(--f-label);display:flex;flex-wrap:wrap;gap:4px 12px}
.toggle .sum{font-size:.95rem;color:var(--muted);max-width:75ch}
.caret{font-family:var(--f-mono);color:var(--muted);transition:transform .2s;display:inline-block}
.card.open .caret{transform:rotate(90deg)}
.done-box{flex:none;display:flex;align-items:center;gap:6px;font-family:var(--f-label);font-size:.85rem;color:var(--muted);cursor:pointer;padding-top:3px;user-select:none}
.done-box input{width:18px;height:18px;accent-color:var(--ok);cursor:pointer}
.card.is-done{border-color:color-mix(in srgb,var(--ok) 55%,var(--line))}
.body{padding:2px 16px 18px 16px;border-top:1px dashed var(--line);display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,330px),1fr));gap:18px 26px}
.blk{min-width:0}
.blk.wide{grid-column:1/-1}
.blk h4{font-family:var(--f-label);font-size:.82rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--c);margin:14px 0 6px}
.blk ul{margin:0;padding-left:1.1em;display:flex;flex-direction:column;gap:5px}
.blk li{font-size:.95rem;line-height:1.55}
.blk li::marker{color:var(--c)}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:6px}
table{border-collapse:collapse;width:100%;font-size:.9rem;line-height:1.4}
th{font-family:var(--f-label);font-weight:700;text-align:left;background:var(--soft);color:var(--ink);padding:7px 10px;white-space:nowrap}
td{padding:6px 10px;border-top:1px solid var(--line);vertical-align:top}
.traps{grid-column:1/-1;background:var(--warn-soft);border-radius:6px;padding:12px 14px}
.traps h4{color:var(--warn);margin-top:0}
.traps li::marker{color:var(--warn)}

.notes{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:18px}
.note{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px;min-width:0}
.note ul{margin:8px 0 0;padding-left:1.1em;display:flex;flex-direction:column;gap:6px;font-size:.93rem}
footer{margin-top:40px;color:var(--muted);font-size:.85rem;border-top:1px solid var(--line);padding-top:14px}

@media (max-width:480px){
  .wrap{padding-inline:16px}
  .toggle{grid-template-columns:1fr}
  .toggle .code{grid-row:auto;padding-top:0}
  .card-head{flex-direction:column;gap:8px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
.home-link{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-label);font-weight:600;font-size:.9rem;color:var(--muted);text-decoration:none;margin-bottom:14px}
.home-link:hover,.home-link:focus-visible{color:var(--ink);text-decoration:underline;outline:none}
</style>

t": "Struktur", "note": "Hakikat ilmu kimia, struktur atom, sistem periodik, ikatan kimia, dan bentuk molekul.", "topics": [{"code": "STR-01", "title": "Hakikat ilmu kimia dan kimia hijau", "scope": "Metode ilmiah, keselamatan", "src": "Kelas X", "tier": 3, "sum": "Peran ilmu kimia, metode ilmiah, keselamatan kerja di laboratorium, simbol bahaya bahan kimia, dan prinsip kimia hijau.", "blocks": [{"h": "Konsep", "li": ["Metode ilmiah: merumuskan masalah, hipotesis, eksperimen, analisis data, kesimpulan.", "Simbol bahaya bahan kimia (sistem GHS) antara lain: mudah terbakar, korosif, beracun, iritan, mudah meledak, berbahaya bagi lingkungan.", "Kimia hijau: merancang proses dan produk kimia yang mengurangi atau menghilangkan zat berbahaya. Dua belas prinsipnya dirumuskan Paul Anastas dan John Warner (1998).", "Contoh prinsip: mencegah limbah lebih baik daripada mengolahnya; memaksimalkan ekonomi atom; memakai pelarut dan bahan baku yang lebih aman dan terbarukan."]}]}, {"code": "STR-02", "title": "Struktur atom dan partikel penyusunnya", "scope": "Proton, neutron, elektron, isotop", "src": "Kelas X", "tier": 1, "sum": "Partikel penyusun atom dan penemunya, nomor atom dan nomor massa, isotop-isobar-isoton, serta perkembangan model atom.", "blocks": [{"h": "Partikel dasar", "table": {"cols": ["Partikel", "Muatan", "Penemu"], "rows": [["Elektron", "−1", "J.J. Thomson (1897), lewat sinar katode"], ["Proton", "+1", "Eugen Goldstein (sinar terusan, 1886); dikenal sebagai proton lewat Rutherford"], ["Neutron", "0", "James Chadwick (1932)"]]}}, {"h": "Notasi dan istilah", "li": ["Notasi <sup>A<\/sup><sub>Z<\/sub>X: Z nomor atom (jumlah proton), A nomor massa (proton + neutron). Jumlah neutron = A − Z.", "Atom netral: jumlah elektron = jumlah proton. Ion X<sup>n+<\/sup> kehilangan n elektron; X<sup>n−<\/sup> menerima n elektron.", "Isotop: Z sama (¹²C dan ¹⁴C). Isobar: A sama. Isoton: jumlah neutron sama."]}, {"h": "Model atom", "li": ["Dalton (bola pejal) → Thomson (roti kismis) → Rutherford (inti bermuatan positif) → Bohr (lintasan berenergi tertentu) → mekanika kuantum (orbital)."]}], "traps": ["Ion Na⁺ punya 10 elektron, bukan 11: ion positif kehilangan elektron.", "Isotop punya sifat kimia sama (elektron sama), tetapi massanya berbeda."]}, {"code": "STR-03", "title": "Konfigurasi elektron dan bilangan kuantum", "scope": "Aufbau, Hund, Pauli", "src": "Kelas XI", "tier": 1, "sum": "Cara menyusun elektron dalam orbital, empat bilangan kuantum, dan cara menentukan golongan dan periode dari konfigurasi.", "blocks": [{"h": "Aturan pengisian", "li": ["<b>Aufbau<\/b>: elektron mengisi orbital dari energi terendah: 1s 2s 2p 3s 3p 4s 3d 4p 5s 4d 5p 6s 4f 5d 6p 7s.", "Pauli: tidak ada dua elektron dalam satu atom dengan empat bilangan kuantum sama; satu orbital berisi paling banyak 2 elektron.", "Hund: pada subkulit berorbital lebih dari satu, elektron mengisi orbital satu per satu dulu sebelum berpasangan.", "Pengecualian penting: Cr = [Ar] 3d⁵ 4s¹ dan Cu = [Ar] 3d¹⁰ 4s¹ (subkulit d setengah penuh atau penuh lebih stabil)."]}, {"h": "Bilangan kuantum", "table": {"cols": ["Bilangan", "Lambang", "Menyatakan", "Nilai"], "rows": [["Utama", "n", "Kulit", "1, 2, 3, …"], ["Azimut", "l", "Subkulit (s, p, d, f)", "0 sampai n − 1"], ["Magnetik", "m", "Orbital", "−l sampai +l"], ["Spin", "s", "Arah putar elektron", "+½ atau −½"]]}}, {"h": "Letak dalam tabel periodik", "li": ["Periode = nomor kulit terbesar. Golongan A = jumlah elektron valensi pada subkulit s dan p terluar.", "Konfigurasi berakhir di s atau p: golongan A (utama). Berakhir di d: golongan B (transisi)."]}], "traps": ["Subkulit 4s diisi sebelum 3d, tetapi saat membentuk ion, elektron 4s yang dilepas lebih dulu (Fe²⁺ = [Ar] 3d⁶)."]}, {"code": "STR-04", "title": "Sistem periodik unsur", "scope": "Sejarah tabel, sifat periodik", "src": "Kelas X", "tier": 1, "sum": "Perkembangan tabel periodik dari Döbereiner sampai Moseley, susunan golongan dan periode, dan kecenderungan sifat periodik.", "blocks": [{"h": "Perkembangan", "table": {"cols": ["Tokoh", "Dasar pengelompokan"], "rows": [["Döbereiner", "Triade: tiga unsur bersifat mirip, massa atom unsur tengah ≈ rata-rata dua lainnya"], ["Newlands", "Hukum oktaf: sifat berulang tiap unsur kedelapan"], ["Mendeleev", "Kenaikan massa atom; menyisakan tempat kosong dan meramalkan unsur yang belum ditemukan (ekasilikon = germanium)"], ["Moseley", "Kenaikan nomor atom; dasar tabel periodik modern"]]}}, {"h": "Tabel modern dan sifat periodik", "li": ["18 golongan dan 7 periode. IA alkali, IIA alkali tanah, VIIA halogen, VIIIA gas mulia.", "<b>Jari-jari atom<\/b>: bertambah dari atas ke bawah dalam satu golongan; berkurang dari kiri ke kanan dalam satu periode.", "Energi ionisasi, afinitas elektron, dan keelektronegatifan cenderung berkebalikan dengan jari-jari: berkurang ke bawah, bertambah ke kanan.", "Keelektronegatifan tertinggi: fluor (F)."]}], "traps": ["Gas mulia tidak dihitung dalam kecenderungan keelektronegatifan karena hampir tidak membentuk ikatan."]}, {"code": "STR-05", "title": "Ikatan kimia", "scope": "Ion, kovalen, logam, polaritas", "src": "Kelas XI", "tier": 1, "sum": "Kestabilan atom, aturan oktet, ikatan ion, kovalen, kovalen koordinasi, dan logam, serta kepolaran molekul.", "blocks": [{"h": "Jenis ikatan", "table": {"cols": ["Ikatan", "Terjadi antara", "Ciri"], "rows": [["Ion", "Logam dan nonlogam", "Serah-terima elektron; contoh NaCl; titik leleh tinggi, lelehan dan larutannya menghantar listrik"], ["Kovalen", "Nonlogam dan nonlogam", "Pemakaian bersama pasangan elektron; tunggal, rangkap dua, rangkap tiga"], ["Kovalen koordinasi", "Satu atom menyumbang pasangan elektron", "Contoh NH₄⁺ dan H₃O⁺"], ["Logam", "Atom-atom logam", "Lautan elektron; menghantar listrik dan dapat ditempa"]]}}, {"h": "Oktet dan kepolaran", "li": ["Aturan oktet: atom cenderung mencapai 8 elektron valensi seperti gas mulia (H cukup 2, duplet).", "Pengecualian oktet: BF₃ (B hanya 6 elektron), PCl₅ dan SF₆ (lebih dari 8).", "Kovalen polar: beda keelektronegatifan besar dan bentuk molekul tidak simetris (H₂O, NH₃, HCl).", "Kovalen nonpolar: atom sama (Cl₂) atau bentuk simetris (CO₂, CH₄, BF₃)."]}], "traps": ["CO₂ punya ikatan polar tetapi molekulnya nonpolar karena bentuknya linear dan simetris."]}, {"code": "STR-06", "title": "Bentuk molekul dan gaya antarmolekul", "scope": "VSEPR, hibridisasi", "src": "Kelas XI", "tier": 2, "sum": "Meramalkan bentuk molekul dengan teori VSEPR dan hibridisasi, serta gaya London, dipol-dipol, dan ikatan hidrogen.", "blocks": [{"h": "Bentuk molekul (A pusat, X pasangan ikatan, E pasangan bebas)", "wide": true, "table": {"cols": ["Tipe", "Bentuk", "Sudut", "Contoh", "Hibridisasi"], "rows": [["AX₂", "Linear", "180°", "CO₂, BeCl₂", "sp"], ["AX₃", "Segitiga datar", "120°", "BF₃", "sp²"], ["AX₄", "Tetrahedral", "109,5°", "CH₄", "sp³"], ["AX₃E", "Piramida segitiga", "±107°", "NH₃", "sp³"], ["AX₂E₂", "Bentuk V (bengkok)", "±104,5°", "H₂O", "sp³"], ["AX₅", "Bipiramida segitiga", "90° dan 120°", "PCl₅", "sp³d"], ["AX₆", "Oktahedral", "90°", "SF₆", "sp³d²"]]}}, {"h": "Gaya antarmolekul", "li": ["Gaya London (dispersi): pada semua molekul, makin kuat bila massa molekul makin besar.", "Dipol-dipol: antara molekul polar.", "<b>Ikatan hidrogen<\/b>: H yang terikat pada F, O, atau N; paling kuat di antara ketiganya. Menjelaskan titik didih air yang tinggi."]}], "traps": ["Pasangan elektron bebas menekan sudut ikatan: sudut H₂O lebih kecil daripada NH₃, yang lebih kecil daripada CH₄."]}]}, {"id": "STO", "name": "Reaksi dan stoikiometri", "short": "Stoikiometri", "note": "Tata nama, persamaan reaksi, hukum dasar, konsep mol, redoks, dan larutan elektrolit.", "topics": [{"code": "STO-01", "title": "Tata nama senyawa dan persamaan reaksi", "scope": "Nama IUPAC, menyetarakan reaksi", "src": "Kelas X", "tier": 2, "sum": "Aturan penamaan senyawa ion, kovalen biner, asam, dan basa, serta cara menulis dan menyetarakan persamaan reaksi.", "blocks": [{"h": "Tata nama", "li": ["Senyawa ion: nama kation lalu anion. NaCl natrium klorida; CaCO₃ kalsium karbonat.", "Logam dengan beberapa muatan memakai angka Romawi: FeCl₂ besi(II) klorida, FeCl₃ besi(III) klorida.", "Kovalen biner memakai awalan mono-, di-, tri-, tetra-, penta-: CO karbon monoksida, N₂O₅ dinitrogen pentaoksida.", "Asam: HCl asam klorida, H₂SO₄ asam sulfat, HNO₃ asam nitrat, CH₃COOH asam asetat (asam etanoat)."]}, {"h": "Persamaan reaksi", "li": ["Wujud ditulis (s) padat, (l) cair, (g) gas, (aq) larutan dalam air.", "Menyetarakan: jumlah atom tiap unsur di ruas kiri sama dengan di ruas kanan; yang diubah hanya koefisien, bukan indeks rumus kimia."]}]}, {"code": "STO-02", "title": "Hukum dasar kimia", "scope": "Lavoisier sampai Avogadro", "src": "Kelas X", "tier": 1, "sum": "Lima hukum dasar kimia dan tokohnya: kekekalan massa, perbandingan tetap, kelipatan perbandingan, perbandingan volume, dan hipotesis Avogadro.", "blocks": [{"h": "Hukum", "table": {"cols": ["Hukum", "Tokoh", "Isi"], "rows": [["Kekekalan massa", "Lavoisier", "Massa zat sebelum dan sesudah reaksi sama (dalam sistem tertutup)"], ["Perbandingan tetap", "Proust", "Perbandingan massa unsur dalam suatu senyawa selalu tetap"], ["Kelipatan perbandingan", "Dalton", "Bila dua unsur membentuk lebih dari satu senyawa, perbandingan massanya berupa bilangan bulat sederhana"], ["Perbandingan volume", "Gay-Lussac", "Pada suhu dan tekanan sama, perbandingan volume gas yang bereaksi berupa bilangan bulat sederhana"], ["Hipotesis Avogadro", "Avogadro", "Pada suhu dan tekanan sama, gas bervolume sama mengandung jumlah molekul sama"]]}}], "traps": ["Hukum Proust tentang satu senyawa; hukum Dalton tentang dua unsur yang membentuk beberapa senyawa."]}, {"code": "STO-03", "title": "Konsep mol dan stoikiometri", "scope": "Mol, rumus empiris, pereaksi pembatas", "src": "Kelas X–XI", "tier": 1, "sum": "Hubungan mol dengan massa, jumlah partikel, dan volume gas; rumus empiris dan molekul; perhitungan reaksi dan pereaksi pembatas.", "blocks": [{"h": "Hubungan mol", "li": ["<b>n = m/M<sub>r<\/sub> = N/N<sub>A<\/sub><\/b>, dengan N<sub>A<\/sub> = 6,02 × 10²³ partikel/mol.", "Gas pada STP (0 °C, 1 atm): V = n × 22,4 L. Pada RTP (25 °C, 1 atm): ±24,4 L/mol.", "Gas ideal: PV = nRT, dengan R = 0,082 L·atm/(mol·K).", "Molaritas M = n/V (mol/L)."]}, {"h": "Stoikiometri", "li": ["Perbandingan koefisien reaksi = perbandingan mol (dan volume, untuk gas pada suhu dan tekanan sama).", "Pereaksi pembatas: zat yang habis lebih dulu; tentukan dengan membandingkan mol/koefisien tiap pereaksi, yang terkecil membatasi.", "Rumus empiris dari perbandingan mol unsur; rumus molekul = (rumus empiris)<sub>n<\/sub> dengan n = M<sub>r<\/sub> molekul / M<sub>r<\/sub> empiris.", "Kadar unsur dalam senyawa = (jumlah atom × A<sub>r<\/sub> / M<sub>r<\/sub>) × 100%."]}], "traps": ["Volume 22,4 L/mol hanya untuk gas pada STP, bukan untuk cairan atau padatan.", "Hasil reaksi dihitung dari pereaksi pembatas, bukan dari pereaksi yang tersisa."]}, {"code": "STO-04", "title": "Reaksi redoks", "scope": "Bilangan oksidasi, oksidator, reduktor", "src": "Kelas X", "tier": 1, "sum": "Perkembangan konsep reduksi-oksidasi, aturan bilangan oksidasi, oksidator dan reduktor, serta reaksi autoredoks.", "blocks": [{"h": "Konsep", "li": ["Oksidasi: pengikatan oksigen, pelepasan elektron, atau <b>kenaikan bilangan oksidasi<\/b>. Reduksi kebalikannya.", "Reduktor mengalami oksidasi; oksidator mengalami reduksi.", "Autoredoks (disproporsionasi): satu zat mengalami oksidasi dan reduksi sekaligus, contoh Cl₂ + 2NaOH → NaCl + NaClO + H₂O."]}, {"h": "Aturan bilangan oksidasi", "li": ["Unsur bebas: 0. Jumlah biloks dalam senyawa netral: 0; dalam ion: sama dengan muatannya.", "Logam golongan IA: +1; IIA: +2.", "H umumnya +1, kecuali dalam hidrida logam (NaH): −1.", "O umumnya −2, kecuali peroksida (H₂O₂): −1, dan OF₂: +2."]}], "traps": ["Reduktor adalah zat yang teroksidasi, bukan yang tereduksi."]}, {"code": "STO-05", "title": "Larutan elektrolit dan nonelektrolit", "scope": "Daya hantar listrik", "src": "Kelas X", "tier": 2, "sum": "Penggolongan larutan berdasarkan daya hantar listrik dan derajat ionisasinya.", "blocks": [{"h": "Penggolongan", "table": {"cols": ["Jenis", "Derajat ionisasi α", "Pengamatan uji", "Contoh"], "rows": [["Elektrolit kuat", "α = 1", "Lampu menyala terang, banyak gelembung", "NaCl, HCl, NaOH, H₂SO₄"], ["Elektrolit lemah", "0 &lt; α &lt; 1", "Lampu redup atau mati, sedikit gelembung", "CH₃COOH, NH₃, HF"], ["Nonelektrolit", "α = 0", "Lampu mati, tidak ada gelembung", "Gula, urea, alkohol"]]}}], "traps": ["Senyawa kovalen polar seperti HCl bersifat elektrolit kuat bila dilarutkan dalam air."]}]}, {"id": "ENE", "name": "Energi, laju, dan kesetimbangan", "short": "Energi & laju", "note": "Perubahan entalpi, laju reaksi, dan kesetimbangan kimia.", "topics": [{"code": "ENE-01", "title": "Termokimia", "scope": "Entalpi, Hess, energi ikatan", "src": "Kelas XI", "tier": 1, "sum": "Reaksi eksoterm dan endoterm, jenis perubahan entalpi standar, kalorimetri, hukum Hess, dan energi ikatan.", "blocks": [{"h": "Konsep", "li": ["ΔH = H<sub>produk<\/sub> − H<sub>reaktan<\/sub>. Eksoterm: ΔH &lt; 0 (melepas kalor, lingkungan memanas). Endoterm: ΔH &gt; 0.", "Entalpi standar: pembentukan (ΔH<sub>f<\/sub>°), penguraian (ΔH<sub>d<\/sub>°), pembakaran (ΔH<sub>c<\/sub>°), diukur per 1 mol pada 25 °C dan 1 atm.", "ΔH<sub>f<\/sub>° unsur dalam bentuk paling stabil = 0."]}, {"h": "Menghitung ΔH", "li": ["Kalorimeter: q = m · c · ΔT; ΔH = −q/n.", "<b>Hukum Hess<\/b>: ΔH reaksi hanya bergantung pada keadaan awal dan akhir, tidak pada jalannya reaksi.", "Dari entalpi pembentukan: ΔH = ΣΔH<sub>f<\/sub>° produk − ΣΔH<sub>f<\/sub>° reaktan.", "Dari energi ikatan: ΔH = Σ energi ikatan yang diputus − Σ energi ikatan yang dibentuk."]}], "traps": ["Rumus energi ikatan urutannya reaktan dikurangi produk, kebalikan rumus entalpi pembentukan.", "Membalik persamaan reaksi membalik tanda ΔH; mengalikan koefisien mengalikan ΔH."]}, {"code": "ENE-02", "title": "Laju reaksi", "scope": "Faktor, orde, persamaan laju", "src": "Kelas XI", "tier": 1, "sum": "Pengertian laju reaksi, teori tumbukan, faktor-faktor yang memengaruhi, serta persamaan laju dan orde reaksi.", "blocks": [{"h": "Konsep", "li": ["Laju = perubahan konsentrasi per satuan waktu (M/s).", "Teori tumbukan: reaksi terjadi bila partikel bertumbukan dengan arah tepat dan energi ≥ energi aktivasi (E<sub>a<\/sub>).", "Faktor yang mempercepat: konsentrasi lebih besar, luas permukaan lebih besar (serbuk), suhu lebih tinggi, dan katalis.", "Katalis mempercepat reaksi dengan menurunkan energi aktivasi, tanpa ikut habis bereaksi."]}, {"h": "Persamaan laju", "li": ["Untuk reaksi aA + bB → produk: <b>v = k[A]<sup>x<\/sup>[B]<sup>y<\/sup><\/b>; x + y = orde total.", "Orde ditentukan dari data percobaan, tidak dari koefisien reaksi (kecuali reaksi elementer).", "Pada banyak soal dinyatakan laju menjadi 2 kali tiap kenaikan suhu 10 °C; gunakan angka yang diberikan soal."]}], "traps": ["Katalis tidak mengubah ΔH reaksi dan tidak menggeser kesetimbangan."]}, {"code": "ENE-03", "title": "Kesetimbangan kimia", "scope": "Kc, Kp, Le Chatelier", "src": "Kelas XI", "tier": 1, "sum": "Kesetimbangan dinamis, tetapan kesetimbangan Kc dan Kp, asas Le Chatelier, dan penerapannya di industri.", "blocks": [{"h": "Tetapan kesetimbangan", "li": ["Untuk aA + bB ⇌ cC + dD: K<sub>c<\/sub> = [C]<sup>c<\/sup>[D]<sup>d<\/sup>/([A]<sup>a<\/sup>[B]<sup>b<\/sup>). Zat padat dan cair murni tidak dimasukkan.", "K<sub>p<\/sub> = K<sub>c<\/sub>(RT)<sup>Δn<\/sup>, Δn = jumlah koefisien gas produk − reaktan.", "Derajat disosiasi α = mol terurai / mol mula-mula."]}, {"h": "Asas Le Chatelier", "li": ["Konsentrasi zat ditambah: kesetimbangan bergeser menjauhi zat itu.", "Tekanan dinaikkan (volume diperkecil): bergeser ke ruas dengan jumlah mol gas lebih kecil.", "Suhu dinaikkan: bergeser ke arah reaksi endoterm.", "Industri: proses Haber-Bosch (N₂ + 3H₂ ⇌ 2NH₃, ΔH = −92 kJ) dan proses kontak (2SO₂ + O₂ ⇌ 2SO₃, katalis V₂O₅)."]}], "traps": ["Hanya perubahan suhu yang mengubah nilai K; konsentrasi dan tekanan hanya menggeser posisi kesetimbangan."]}]}, {"id": "LAR", "name": "Larutan", "short": "Larutan", "note": "Asam basa, larutan penyangga, hidrolisis, kelarutan, sifat koligatif, dan koloid.", "topics": [{"code": "LAR-01", "title": "Asam, basa, dan pH", "scope": "Teori asam basa, pH, titrasi", "src": "Kelas XI–XII", "tier": 1, "sum": "Teori asam-basa Arrhenius, Brønsted-Lowry, dan Lewis; menghitung pH asam dan basa kuat dan lemah; indikator dan titrasi.", "blocks": [{"h": "Teori", "table": {"cols": ["Teori", "Asam", "Basa"], "rows": [["Arrhenius", "Menghasilkan H⁺ dalam air", "Menghasilkan OH⁻ dalam air"], ["Brønsted-Lowry", "Donor proton (H⁺)", "Akseptor proton; membentuk pasangan asam-basa konjugasi"], ["Lewis", "Akseptor pasangan elektron", "Donor pasangan elektron"]]}}, {"h": "Menghitung pH (25 °C)", "li": ["pH = −log[H⁺]; pOH = −log[OH⁻]; pH + pOH = 14 (K<sub>w<\/sub> = 10⁻¹⁴).", "Asam kuat: [H⁺] = a · M (a = valensi asam). Basa kuat: [OH⁻] = b · M.", "Asam lemah: <b>[H⁺] = √(K<sub>a<\/sub> · M)<\/b>. Basa lemah: [OH⁻] = √(K<sub>b<\/sub> · M)."]}, {"h": "Indikator dan titrasi", "li": ["Fenolftalein: tidak berwarna → merah muda pada pH ±8,3–10. Metil oranye: merah → kuning pada pH ±3,1–4,4. Bromtimol biru: kuning → biru pada pH ±6,0–7,6.", "Titrasi: pada titik ekuivalen mol H⁺ = mol OH⁻, yaitu a · M<sub>a<\/sub> · V<sub>a<\/sub> = b · M<sub>b<\/sub> · V<sub>b<\/sub>."]}], "traps": ["Pengenceran 10 kali asam kuat menaikkan pH 1 satuan; pH asam lemah naik lebih sedikit."]}, {"code": "LAR-02", "title": "Larutan penyangga", "scope": "Buffer asam dan basa", "src": "Kelas XII", "tier": 1, "sum": "Komponen larutan penyangga, cara menghitung pH-nya, dan peran penyangga dalam tubuh.", "blocks": [{"h": "Rumus", "li": ["Penyangga asam (asam lemah + basa konjugasinya, misalnya CH₃COOH + CH₃COONa): [H⁺] = K<sub>a<\/sub> × (mol asam / mol basa konjugasi).", "Penyangga basa (basa lemah + asam konjugasinya, misalnya NH₃ + NH₄Cl): [OH⁻] = K<sub>b<\/sub> × (mol basa / mol asam konjugasi).", "Penyangga dapat terbentuk dari asam lemah berlebih yang direaksikan dengan basa kuat.", "pH penyangga hampir tidak berubah bila ditambah sedikit asam, basa, atau diencerkan."]}, {"h": "Dalam tubuh", "li": ["Darah: penyangga karbonat (H₂CO₃/HCO₃⁻) menjaga pH ±7,4. Dalam sel: penyangga fosfat (H₂PO₄⁻/HPO₄²⁻)."]}], "traps": ["Penyangga dari asam lemah dan basa kuat hanya terbentuk bila asam lemahnya bersisa; bila habis tepat, yang terjadi hidrolisis."]}, {"code": "LAR-03", "title": "Hidrolisis garam", "scope": "Sifat larutan garam", "src": "Kelas XII", "tier": 2, "sum": "Reaksi ion garam dengan air dan cara menghitung pH larutan garam menurut asam dan basa pembentuknya.", "blocks": [{"h": "Jenis dan rumus", "table": {"cols": ["Garam dari", "Sifat", "Rumus"], "rows": [["Asam kuat + basa kuat (NaCl)", "Netral, tidak terhidrolisis", "pH = 7"], ["Asam lemah + basa kuat (CH₃COONa)", "Basa, hidrolisis sebagian", "[OH⁻] = √((K<sub>w<\/sub>/K<sub>a<\/sub>) · [anion])"], ["Asam kuat + basa lemah (NH₄Cl)", "Asam, hidrolisis sebagian", "[H⁺] = √((K<sub>w<\/sub>/K<sub>b<\/sub>) · [kation])"], ["Asam lemah + basa lemah (CH₃COONH₄)", "Bergantung K<sub>a<\/sub> dan K<sub>b<\/sub>, hidrolisis total", "[H⁺] = √(K<sub>w<\/sub> · K<sub>a<\/sub>/K<sub>b<\/sub>)"]]}}], "traps": ["Sifat garam mengikuti komponen yang kuat: garam dari asam kuat dan basa lemah bersifat asam."]}, {"code": "LAR-04", "title": "Kelarutan dan hasil kali kelarutan", "scope": "Ksp, ion senama, pengendapan", "src": "Kelas XII", "tier": 2, "sum": "Hubungan kelarutan dengan Ksp, pengaruh ion senama, dan cara meramalkan terbentuknya endapan.", "blocks": [{"h": "Rumus", "li": ["Untuk A<sub>x<\/sub>B<sub>y<\/sub>: K<sub>sp<\/sub> = (xs)<sup>x<\/sup>(ys)<sup>y<\/sup>, s = kelarutan (mol/L).", "Contoh: AgCl, K<sub>sp<\/sub> = s²; Ag₂CrO₄, K<sub>sp<\/sub> = 4s³.", "Ion senama memperkecil kelarutan.", "Pengendapan: hitung Q<sub>c<\/sub> dari konsentrasi ion. Q<sub>c<\/sub> &lt; K<sub>sp<\/sub> belum jenuh; = jenuh; &gt; terbentuk endapan."]}], "traps": ["Ksp lebih kecil tidak selalu berarti kelarutan lebih kecil bila rumus garamnya berbeda tipe (AgCl dibanding Ag₂CrO₄)."]}, {"code": "LAR-05", "title": "Sifat koligatif larutan", "scope": "ΔP, ΔTb, ΔTf, tekanan osmotik", "src": "Kelas XII", "tier": 1, "sum": "Empat sifat koligatif yang bergantung pada jumlah partikel zat terlarut, termasuk faktor van't Hoff untuk elektrolit.", "blocks": [{"h": "Rumus", "li": ["Penurunan tekanan uap: ΔP = X<sub>terlarut<\/sub> · P°.", "Kenaikan titik didih: ΔT<sub>b<\/sub> = K<sub>b<\/sub> · m · i. Penurunan titik beku: ΔT<sub>f<\/sub> = K<sub>f<\/sub> · m · i.", "Tekanan osmotik: π = M · R · T · i.", "Faktor van't Hoff: i = 1 + (n − 1)α; nonelektrolit i = 1.", "Untuk air: K<sub>b<\/sub> = 0,52 °C/m; K<sub>f<\/sub> = 1,86 °C/m."]}, {"h": "Penerapan", "li": ["Garam di jalan bersalju, cairan infus isotonik, pengawetan dengan garam, dan desalinasi air laut (osmosis balik)."]}], "traps": ["Molalitas (m, mol per kg pelarut) berbeda dari molaritas (M, mol per liter larutan).", "NaCl 0,1 m menurunkan titik beku sekitar dua kali glukosa 0,1 m, karena i ≈ 2."]}, {"code": "LAR-06", "title": "Sistem koloid", "scope": "Jenis, sifat, pembuatan", "src": "Kelas XII", "tier": 2, "sum": "Perbedaan larutan, koloid, dan suspensi; jenis koloid; sifat-sifatnya; dan cara pembuatannya.", "blocks": [{"h": "Jenis koloid", "table": {"cols": ["Fase terdispersi", "Medium", "Nama", "Contoh"], "rows": [["Padat", "Cair", "Sol", "Tinta, cat"], ["Cair", "Cair", "Emulsi", "Susu, santan, mayones"], ["Gas", "Cair", "Buih", "Busa sabun"], ["Cair", "Gas", "Aerosol cair", "Kabut"], ["Padat", "Gas", "Aerosol padat", "Asap"], ["Cair", "Padat", "Gel (emulsi padat)", "Agar-agar, jeli"], ["Gas", "Padat", "Buih padat", "Batu apung, styrofoam"]]}}, {"h": "Sifat dan pembuatan", "li": ["Efek Tyndall (menghamburkan cahaya), gerak Brown, adsorpsi, koagulasi, dialisis (cuci darah), elektroforesis.", "Koloid liofil (suka medium, stabil) dan liofob (tidak suka medium).", "Pembuatan: kondensasi (partikel kecil digabung) atau dispersi (partikel besar dipecah)."]}], "traps": ["Larutan sejati tidak menunjukkan efek Tyndall; koloid menunjukkannya."]}]}, {"id": "ELK", "name": "Elektrokimia", "short": "Elektrokimia", "note": "Sel volta, korosi, dan elektrolisis.", "topics": [{"code": "ELK-01", "title": "Sel volta dan korosi", "scope": "Potensial sel, deret volta", "src": "Kelas XII", "tier": 1, "sum": "Sel yang mengubah energi kimia menjadi listrik: susunan, potensial sel standar, deret volta, sel dalam kehidupan, dan korosi.", "blocks": [{"h": "Sel volta", "li": ["Anoda: oksidasi, kutub negatif. Katoda: reduksi, kutub positif.", "<b>E°<sub>sel<\/sub> = E°<sub>katoda<\/sub> − E°<sub>anoda<\/sub><\/b>; reaksi berlangsung spontan bila E°<sub>sel<\/sub> &gt; 0.", "Contoh: Zn | Zn²⁺ || Cu²⁺ | Cu, dengan E° Zn = −0,76 V dan Cu = +0,34 V, sehingga E°<sub>sel<\/sub> = 1,10 V.", "Deret volta: Li K Ba Ca Na Mg Al Mn (H₂O) Zn Cr Fe Cd Co Ni Sn Pb (H) Sb Bi Cu Hg Ag Pt Au.", "Logam di kiri deret lebih mudah teroksidasi dan dapat mendesak ion logam di kanannya dari larutan."]}, {"h": "Korosi", "li": ["Perkaratan besi adalah reaksi redoks yang memerlukan oksigen dan air; karat Fe₂O₃ · xH₂O.", "Pencegahan: pengecatan, pelumuran oli, galvanisasi (pelapisan seng), dan proteksi katodik (menghubungkan dengan logam lebih aktif seperti Mg)."]}], "traps": ["Di sel volta anoda bermuatan negatif; di sel elektrolisis anoda bermuatan positif. Di keduanya anoda tempat oksidasi."]}, {"code": "ELK-02", "title": "Elektrolisis dan hukum Faraday", "scope": "Reaksi di elektrode, massa endapan", "src": "Kelas XII", "tier": 1, "sum": "Sel yang memakai listrik untuk menjalankan reaksi: reaksi di katoda dan anoda, hukum Faraday, dan penerapannya.", "blocks": [{"h": "Reaksi di elektrode (larutan, elektrode inert)", "li": ["Katoda (−, reduksi): ion logam aktif (golongan IA, IIA, Al, Mn) tidak tereduksi; yang tereduksi air: 2H₂O + 2e⁻ → H₂ + 2OH⁻. Ion H⁺ dan ion logam lain tereduksi.", "Anoda (+, oksidasi): ion sisa asam oksi (SO₄²⁻, NO₃⁻) tidak teroksidasi; yang teroksidasi air: 2H₂O → O₂ + 4H⁺ + 4e⁻. Ion halida membentuk X₂.", "Anoda tidak inert (misalnya Cu): logam anoda itu sendiri yang teroksidasi.", "Lelehan (tanpa air): kation tereduksi di katoda dan anion teroksidasi di anoda."]}, {"h": "Hukum Faraday", "li": ["<b>w = (e · i · t)/96.500<\/b>, dengan e = A<sub>r<\/sub>/muatan ion, i dalam ampere, t dalam detik.", "Hukum II: untuk muatan listrik sama, w₁/w₂ = e₁/e₂.", "Penerapan: penyepuhan (benda yang dilapisi di katoda), pemurnian tembaga, produksi aluminium dan NaOH."]}], "traps": ["Elektrolisis larutan NaCl menghasilkan H₂ di katoda, bukan logam Na."]}]}, {"id": "ORG", "name": "Kimia karbon dan makromolekul", "short": "Organik", "note": "Hidrokarbon, gugus fungsi, benzena, dan makromolekul.", "topics": [{"code": "ORG-01", "title": "Hidrokarbon dan minyak bumi", "scope": "Alkana, alkena, alkuna, fraksi minyak", "src": "Kelas XI", "tier": 2, "sum": "Kekhasan atom karbon, golongan hidrokarbon dan tata namanya, isomer, serta pengolahan minyak bumi dan dampak pembakarannya.", "blocks": [{"h": "Hidrokarbon", "table": {"cols": ["Golongan", "Rumus umum", "Ikatan", "Contoh"], "rows": [["Alkana", "C<sub>n<\/sub>H<sub>2n+2<\/sub>", "Tunggal (jenuh)", "Metana CH₄"], ["Alkena", "C<sub>n<\/sub>H<sub>2n<\/sub>", "Satu rangkap dua", "Etena C₂H₄"], ["Alkuna", "C<sub>n<\/sub>H<sub>2n−2<\/sub>", "Satu rangkap tiga", "Etuna C₂H₂"]]}}, {"h": "Tata nama dan isomer", "li": ["Tentukan rantai terpanjang, beri nomor dari ujung terdekat cabang (atau ikatan rangkap), lalu tulis cabang menurut abjad.", "Atom C primer, sekunder, tersier, kuaterner: terikat pada 1, 2, 3, 4 atom C lain.", "Isomer struktur: rumus molekul sama, susunan berbeda. Isomer geometri (cis-trans) pada alkena."]}, {"h": "Minyak bumi", "li": ["Dipisahkan dengan distilasi bertingkat berdasarkan perbedaan titik didih.", "Mutu bensin dinyatakan bilangan oktan: isooktana = 100, n-heptana = 0.", "Pembakaran tidak sempurna menghasilkan CO yang beracun karena mengikat hemoglobin."]}], "traps": ["Penomoran rantai dimulai dari ujung yang paling dekat dengan cabang, bukan selalu dari kiri."]}, {"code": "ORG-02", "title": "Gugus fungsi senyawa karbon", "scope": "Alkohol sampai ester", "src": "Kelas XII", "tier": 1, "sum": "Gugus fungsi alkohol, eter, aldehida, keton, asam karboksilat, ester, dan haloalkana: tata nama, isomer fungsi, uji, dan reaksi.", "blocks": [{"h": "Gugus fungsi", "wide": true, "table": {"cols": ["Golongan", "Gugus", "Nama IUPAC", "Contoh"], "rows": [["Alkohol", "R–OH", "Alkanol", "Etanol"], ["Eter", "R–O–R'", "Alkoksialkana", "Metoksimetana"], ["Aldehida", "R–CHO", "Alkanal", "Metanal (formalin)"], ["Keton", "R–CO–R'", "Alkanon", "Propanon (aseton)"], ["Asam karboksilat", "R–COOH", "Asam alkanoat", "Asam etanoat (cuka)"], ["Ester", "R–COO–R'", "Alkil alkanoat", "Etil etanoat"], ["Haloalkana", "R–X", "Haloalkana", "Kloroform (triklorometana)"]]}}, {"h": "Isomer dan reaksi", "li": ["Isomer fungsi: alkohol dengan eter, aldehida dengan keton, asam karboksilat dengan ester.", "Uji Tollens (cermin perak) dan Fehling (endapan merah bata) positif untuk aldehida, negatif untuk keton.", "<b>Esterifikasi<\/b>: asam karboksilat + alkohol → ester + air (ester beraroma buah)."]}], "traps": ["Aldehida dan keton sama-sama punya gugus karbonil; bedanya letak karbonil (ujung atau tengah rantai)."]}, {"code": "ORG-03", "title": "Benzena dan turunannya", "scope": "Struktur, reaksi, turunan", "src": "Kelas XII", "tier": 2, "sum": "Struktur benzena menurut Kekulé dan resonansi, reaksi substitusi, tata nama turunan benzena, dan kegunaannya.", "blocks": [{"h": "Konsep", "li": ["Kekulé (1865) mengusulkan cincin enam atom C dengan ikatan rangkap berselang-seling; elektronnya terdelokalisasi (resonansi).", "Benzena lebih mudah mengalami substitusi daripada adisi: halogenasi, nitrasi, sulfonasi, dan alkilasi (Friedel-Crafts).", "Turunan: toluena (metilbenzena), fenol (hidroksibenzena), anilina (aminobenzena), asam benzoat, nitrobenzena, stirena.", "Posisi dua substituen: orto (1,2), meta (1,3), para (1,4)."]}]}, {"code": "ORG-04", "title": "Makromolekul", "scope": "Polimer, karbohidrat, protein, lemak", "src": "Kelas XII", "tier": 2, "sum": "Polimer sintetis dan alami, jenis karbohidrat, protein dan uji-ujinya, serta lemak dan reaksi penyabunan.", "blocks": [{"h": "Polimer", "li": ["Polimerisasi adisi (monomer berikatan rangkap): polietena (plastik), PVC, teflon.", "Polimerisasi kondensasi (melepas molekul kecil seperti air): nilon, poliester (dakron), protein, amilum."]}, {"h": "Biomolekul", "li": ["Monosakarida: glukosa, fruktosa, galaktosa. Disakarida: sukrosa (glukosa + fruktosa), laktosa (glukosa + galaktosa), maltosa (glukosa + glukosa). Polisakarida: amilum, glikogen, selulosa.", "Uji karbohidrat: iodin (amilum biru tua), Benedict atau Fehling (gula pereduksi; sukrosa negatif).", "Protein tersusun dari asam amino yang dihubungkan ikatan peptida. Uji biuret (ungu, ikatan peptida), xantoproteat (jingga, cincin benzena), timbal(II) asetat (hitam, belerang).", "Lemak adalah ester gliserol dan asam lemak; direaksikan dengan basa kuat menjadi sabun (saponifikasi)."]}], "traps": ["Sukrosa bukan gula pereduksi, jadi uji Benedict atau Fehling-nya negatif."]}]}], "notes": [{"title": "Perlu diperhatikan", "items": ["Kelas X Kurikulum Merdeka membahas kimia di dalam mata pelajaran IPA; kelas XI dan XII memakai buku Kimia (mata pelajaran pilihan). Sumber berbeda menempatkan stoikiometri di kelas X, XI, atau XII.", "Volume molar: buku sekolah memakai 22,4 L/mol untuk STP (0 °C, 1 atm). Definisi IUPAC terbaru memakai 1 bar sehingga nilainya 22,7 L/mol; ikuti angka di soal.", "Rentang perubahan warna indikator dibulatkan; buku yang berbeda memberi angka sedikit berbeda."]}, {"title": "Rujukan", "items": ["Buku teks Kimia Kurikulum Merdeka kelas XI (Munasprianto Ramli dkk., 2022) dan kelas XII (Kemendikbudristek). Daftar bab dicocokkan lewat ringkasan Tirto, Kumparan, dan Mamikos karena PDF resmi tidak dapat dibuka dari lingkungan kerja.", "Data potensial elektrode, K<sub>b<\/sub> dan K<sub>f<\/sub> air, serta tetapan lain mengikuti nilai baku di buku kimia SMA."]}]};
const TIER = {1:["t1","Inti"],2:["t2","Penting"],3:["t3","Pelengkap"]};
const KEY = "peta-" + MAP.id + "-v1";
let done = new Set();
try { done = new Set(JSON.parse(localStorage.getItem(KEY) || "[]")); } catch(e) {}
function save(){ try { localStorage.setItem(KEY, JSON.stringify([...done])); } catch(e) {} }
const $ = id => document.getElementById(id);
// The text faces lack most Unicode superscript/subscript digits, so turn runs of them into <sup>/<sub>.
const SUP = "⁰¹²³⁴⁵⁶⁷⁸⁹⁻⁺", SUB = "₀₁₂₃₄₅₆₇₈₉", PLAIN = "0123456789-+";
function scripts(s){
  return s.replace(/[⁰¹²³⁴⁵⁶⁷⁸⁹⁻⁺]+/g, m => "<sup>" + [...m].map(c => PLAIN[SUP.indexOf(c)]).join("").replace("-", "−") + "</sup>")
          .replace(/[₀₁₂₃₄₅₆₇₈₉]+/g, m => "<sub>" + [...m].map(c => PLAIN[SUB.indexOf(c)]).join("") + "</sub>");
}
(function walk(o){ for(const k in o){ if(typeof o[k] === "string") o[k] = scripts(o[k]); else if(o[k] && typeof o[k] === "object") walk(o[k]); } })(MAP);
const byCode = {};
MAP.domains.forEach((d,i) => { d.c = "var(--d" + (i % 7 + 1) + ")"; d.soft = "var(--s" + (i % 7 + 1) + ")"; d.topics.forEach(t => byCode[t.code] = {t, d}); });

function hl(str, re){
  if(!re) return str;
  return str.split(/(<[^>]+>)/g).map(p => p.startsWith("<") ? p : p.replace(re, m => "<mark>" + m + "</mark>")).join("");
}
function plain(t){
  const parts = [t.code, t.title, t.scope, t.src, t.sum];
  t.blocks.forEach(b => { parts.push(b.h); (b.li||[]).forEach(x => parts.push(x)); if(b.table){ parts.push(b.table.cols.join(" ")); b.table.rows.forEach(r => parts.push(r.join(" "))); } });
  (t.traps||[]).forEach(x => parts.push(x));
  return parts.join(" ").replace(/<[^>]+>/g, " ");
}
function bodyHTML(t, re){
  let h = "";
  t.blocks.forEach(b => {
    h += '<div class="blk' + (b.wide || (b.table && b.table.cols.length > 2) ? ' wide' : '') + '"><h4>' + hl(b.h, re) + '</h4>';
    if(b.li) h += "<ul>" + b.li.map(x => "<li>" + hl(x, re) + "</li>").join("") + "</ul>";
    if(b.table) h += '<div class="tbl"><table><thead><tr>' + b.table.cols.map(c => "<th>" + c + "</th>").join("") + "</tr></thead><tbody>" +
      b.table.rows.map(r => "<tr>" + r.map(c => "<td>" + hl(c, re) + "</td>").join("") + "</tr>").join("") + "</tbody></table></div>";
    h += "</div>";
  });
  if(t.traps && t.traps.length) h += '<div class="traps"><h4>Jebakan soal</h4><ul>' + t.traps.map(x => "<li>" + hl(x, re) + "</li>").join("") + "</ul></div>";
  return h;
}

function render(){
  const total = Object.keys(byCode).length;
  document.title = MAP.title;
  $("eyebrow").textContent = "Peta materi · " + MAP.subject + " · " + MAP.domains.length + " bidang · " + total + " simpul";
  $("title").textContent = MAP.title;
  $("lead").innerHTML = MAP.lead;
  $("sourceNote").textContent = MAP.source_note || "";
  $("progress").innerHTML = MAP.domains.map(d => '<a class="pg" href="#d-' + d.id + '" style="--c:' + d.c + '"><b>' + d.short + '</b><div class="bar"><i id="bar-' + d.id + '"></i></div><span id="pg-' + d.id + '"></span></a>').join("");
  if(MAP.path && MAP.path.length){
    $("alur").hidden = false;
    $("h-alur").textContent = MAP.path_title || "Alur belajar";
    $("pathNote").textContent = MAP.path_note || "";
    $("path").innerHTML = MAP.path.map(e => '<li><button type="button" data-code="' + e.to + '"><span class="lb">' + e.label + '</span><span class="nm">' + e.title + '</span><span class="an">' + e.note + '</span></button></li>').join("");
  }
  const map = $("map"), host = $("domains");
  MAP.domains.forEach(d => {
    const col = document.createElement("div");
    col.className = "mcol"; col.style.setProperty("--c", d.c); col.style.setProperty("--soft", d.soft);
    col.innerHTML = '<h3><span>' + d.name + '</span><span class="mono">' + d.topics.length + '</span></h3><ul>' +
      d.topics.map(t => '<li><a class="chip" data-code="' + t.code + '" href="#t-' + t.code + '"><span class="mono">' + t.code + '</span><span>' + t.title + ' <span class="tier ' + TIER[t.tier][0] + '">' + TIER[t.tier][1] + '</span></span></a></li>').join("") + "</ul>";
    map.appendChild(col);
    const sec = document.createElement("section");
    sec.id = "d-" + d.id; sec.style.setProperty("--c", d.c); sec.style.setProperty("--soft", d.soft);
    sec.innerHTML = '<div class="domain-head"><h2>' + d.name + '</h2><span class="w">' + d.topics.length + ' simpul</span><p>' + (d.note || "") + '</p></div>';
    d.topics.forEach(t => {
      const a = document.createElement("article");
      a.className = "card"; a.id = "t-" + t.code; a.dataset.code = t.code;
      a.innerHTML = '<div class="card-head"><button class="toggle" type="button" aria-expanded="false" aria-controls="b-' + t.code + '">' +
        '<span class="code">' + t.code + '</span>' +
        '<span class="ttl"><span class="caret" aria-hidden="true">›</span>' + t.title + ' <span class="tier ' + TIER[t.tier][0] + '">' + TIER[t.tier][1] + '</span></span>' +
        '<span class="meta"><span>' + t.scope + '</span><span>' + t.src + '</span></span>' +
        '<span class="sum">' + t.sum + '</span></button>' +
        '<label class="done-box"><input type="checkbox" id="done-' + t.code + '"> Dikuasai</label></div>' +
        '<div class="body" id="b-' + t.code + '" hidden>' + bodyHTML(t, null) + '</div>';
      sec.appendChild(a);
    });
    host.appendChild(sec);
  });
  $("notes").innerHTML = (MAP.notes || []).map(n => '<div class="note"><h3>' + n.title + '</h3><ul>' + n.items.map(i => "<li>" + i + "</li>").join("") + "</ul></div>").join("");
}
function setOpen(card, open){
  card.classList.toggle("open", open);
  card.querySelector(".body").hidden = !open;
  card.querySelector(".toggle").setAttribute("aria-expanded", open ? "true" : "false");
}
function goTo(code){
  const card = $("t-" + code); if(!card) return;
  card.hidden = false; setOpen(card, true);
  card.scrollIntoView({behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block:"start"});
}
function progress(){
  let k = 0, n = 0;
  MAP.domains.forEach(d => {
    const dn = d.topics.filter(t => done.has(t.code)).length;
    k += dn; n += d.topics.length;
    $("bar-" + d.id).style.width = (dn / d.topics.length * 100) + "%";
    $("pg-" + d.id).textContent = dn + " dari " + d.topics.length;
  });
  $("overall").textContent = k + " dari " + n;
  document.querySelectorAll(".chip").forEach(c => c.classList.toggle("done", done.has(c.dataset.code)));
  document.querySelectorAll(".card").forEach(c => { const on = done.has(c.dataset.code); c.classList.toggle("is-done", on); c.querySelector('input[type="checkbox"]').checked = on; });
}
function search(q){
  q = q.trim();
  const re = q.length >= 2 ? new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "gi") : null;
  let hits = 0;
  document.querySelectorAll(".card").forEach(card => {
    const t = byCode[card.dataset.code].t, body = card.querySelector(".body");
    if(!re){ card.hidden = false; body.innerHTML = bodyHTML(t, null); setOpen(card, false); return; }
    const match = new RegExp(re.source, "i").test(plain(t));
    card.hidden = !match; body.innerHTML = bodyHTML(t, match ? re : null); setOpen(card, match);
    if(match) hits++;
  });
  $("hits").textContent = re ? (hits ? hits + " simpul cocok" : "Tidak ada yang cocok. Coba kata lain.") : "";
}

render();
progress();
document.addEventListener("click", e => {
  const tg = e.target.closest(".toggle");
  if(tg){ const card = tg.closest(".card"); setOpen(card, !card.classList.contains("open")); return; }
  const chip = e.target.closest("[data-code]");
  if(chip && (chip.classList.contains("chip") || chip.tagName === "BUTTON")){ e.preventDefault(); goTo(chip.dataset.code); }
});
document.addEventListener("change", e => {
  if(e.target.matches(".done-box input")){
    const code = e.target.closest(".card").dataset.code;
    e.target.checked ? done.add(code) : done.delete(code);
    save(); progress();
  }
});
let timer;
$("q").addEventListener("input", e => { clearTimeout(timer); timer = setTimeout(() => search(e.target.value), 150); });
$("openAll").addEventListener("click", () => document.querySelectorAll(".card:not([hidden])").forEach(c => setOpen(c, true)));
$("closeAll").addEventListener("click", () => document.querySelectorAll(".card").forEach(c => setOpen(c, false)));
if(location.hash.startsWith("#t-")) goTo(location.hash.slice(3));
</script>
